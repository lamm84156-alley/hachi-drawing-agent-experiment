[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "hachi-drawing-experiment"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy", "Pillow", "matplotlib", "requests", "torch", "svgpathtools", "cssutils", "scikit-image"]
[project.optional-dependencies]
test = ["pytest"]
[project.scripts]
hachi = "hachi.cli:main"
[tool.setuptools.packages.find]
include = ["hachi*"]
